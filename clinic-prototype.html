<title>Campus Clinic Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: top bar with role tabs, one content column; tables scroll inside their own wrapper. */
:root{
  --bg:#f4f7f7; --surface:#ffffff; --ink:#15262b; --muted:#5b6f75; --line:#d9e2e4;
  --accent:#0e6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --ok:#1b7a43; --ok-soft:#dff3e6; --warn:#8a5a00; --warn-soft:#fbefd2; --bad:#a32727; --bad-soft:#fae0e0;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e; --surface:#16272b; --ink:#e4eef0; --muted:#94aab0; --line:#27393e;
  --accent:#4fbdbd; --accent-ink:#06191a; --accent-soft:#18383a;
  --ok:#6fd59a; --ok-soft:#173a27; --warn:#f0c46a; --warn-soft:#3a2f12; --bad:#f19292; --bad-soft:#3b1b1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --surface:#16272b; --ink:#e4eef0; --muted:#94aab0; --line:#27393e;
  --accent:#4fbdbd; --accent-ink:#06191a; --accent-soft:#18383a;
  --ok:#6fd59a; --ok-soft:#173a27; --warn:#f0c46a; --warn-soft:#3a2f12; --bad:#f19292; --bad-soft:#3b1b1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.wrap{max-width:1000px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:16px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-right:auto}
.brand small{display:block;font-family:var(--font);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.danger{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
.pill.Confirmed{background:var(--accent-soft);color:var(--accent)}
.pill.Completed,.pill.Available,.pill.Active{background:var(--ok-soft);color:var(--ok)}
.pill.Cancelled,.pill.Unavailable,.pill.Inactive{background:var(--bad-soft);color:var(--bad)}
.pill.No-show{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:8px;padding:10px 14px;font-size:.88rem}
.note.info{background:var(--accent-soft)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)}
.slot{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.login{max-width:420px;margin:48px auto}
.demo{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.big{font-family:var(--display);font-size:1.8rem;font-weight:700}
.theme{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
</style>
<div class="wrap" id="app"></div>
<script>
(function(){
"use strict";
var KEY="campus-clinic-prototype-v1";
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function dayName(s){return DAYS[parse(s).getDay()]}
function prettyDate(s){var d=parse(s);return DAYS[d.getDay()].slice(0,3)+", "+MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate()+", "+d.getFullYear()}
function t12(t){var p=t.split(":"),h=+p[0],m=p[1];return (h%12||12)+":"+m+" "+(h>=12?"PM":"AM")}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function fromMins(m){return pad(Math.floor(m/60))+":"+pad(m%60)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- sample data (same seven tables as the ERD) ---------- */
function seed(){
  var today=new Date(), t=iso(today);
  function nextOn(name){for(var i=1;i<15;i++){var d=addDays(today,i);if(DAYS[d.getDay()]===name)return iso(d)}}
  var db={
    users:[
      {user_id:1,username:"nurse",password:"demo123",full_name:"Clinic Nurse (sample)",role:"Nurse",status:"Active",date_created:t},
      {user_id:2,username:"admin",password:"demo123",full_name:"Clinic Administrator (sample)",role:"Administrator",status:"Active",date_created:t},
      {user_id:3,username:"doctor",password:"demo123",full_name:"Dr. Ramon Villanueva",role:"Doctor",status:"Active",date_created:t,doctor_id:1},
      {user_id:4,username:"dentist",password:"demo123",full_name:"Dr. Carlo Dizon",role:"Doctor",status:"Active",date_created:t,doctor_id:3},
      {user_id:5,username:"student",password:"demo123",full_name:"Juan Dela Cruz",role:"Patient",status:"Active",date_created:t,patient_id:1}
    ],
    patients:[
      {patient_id:1,student_number:"2301234",patient_type:"Student",last_name:"Dela Cruz",first_name:"Juan",middle_name:"",department:"College of Computer Studies",year_level:"3rd Year",contact_number:"09171234567",email:"juan@example.com",guardian_name:"Rosa Dela Cruz",guardian_contact:"09181234567",date_registered:t},
      {patient_id:2,student_number:"2304567",patient_type:"Student",last_name:"Santos",first_name:"Maria",middle_name:"L.",department:"College of Nursing",year_level:"2nd Year",contact_number:"09191112222",email:"",guardian_name:"Elena Santos",guardian_contact:"09201112222",date_registered:t},
      {patient_id:3,student_number:"2209876",patient_type:"Student",last_name:"Reyes",first_name:"Pedro",middle_name:"",department:"Senior High School",year_level:"Grade 12",contact_number:"09223334444",email:"",guardian_name:"Marco Reyes",guardian_contact:"09223335555",date_registered:t},
      {patient_id:4,student_number:"E-0045",patient_type:"Employee",last_name:"Garcia",first_name:"Ana",middle_name:"",department:"Registrar's Office",year_level:"",contact_number:"09305556666",email:"",guardian_name:"",guardian_contact:"",date_registered:t}
    ],
    doctors:[
      {doctor_id:1,last_name:"Villanueva",first_name:"Ramon",specialization:"Physician",license_number:"PRC-0001",contact_number:"",employment_type:"Part-time",status:"Active"},
      {doctor_id:2,last_name:"Mendoza",first_name:"Lorna",specialization:"Physician",license_number:"PRC-0002",contact_number:"",employment_type:"Part-time",status:"Active"},
      {doctor_id:3,last_name:"Dizon",first_name:"Carlo",specialization:"Dentist",license_number:"PRC-0003",contact_number:"",employment_type:"Part-time",status:"Active"}
    ],
    schedules:[
      {schedule_id:1,doctor_id:1,day_of_week:"Monday",time_start:"08:00",time_end:"12:00",slot_limit:6,availability_status:"Available"},
      {schedule_id:2,doctor_id:1,day_of_week:"Wednesday",time_start:"08:00",time_end:"12:00",slot_limit:6,availability_status:"Available"},
      {schedule_id:3,doctor_id:1,day_of_week:"Friday",time_start:"08:00",time_end:"12:00",slot_limit:6,availability_status:"Available"},
      {schedule_id:4,doctor_id:2,day_of_week:"Tuesday",time_start:"13:00",time_end:"16:00",slot_limit:5,availability_status:"Available"},
      {schedule_id:5,doctor_id:2,day_of_week:"Thursday",time_start:"13:00",time_end:"16:00",slot_limit:5,availability_status:"Available"},
      {schedule_id:6,doctor_id:3,day_of_week:"Monday",time_start:"13:00",time_end:"16:00",slot_limit:4,availability_status:"Available"},
      {schedule_id:7,doctor_id:3,day_of_week:"Wednesday",time_start:"13:00",time_end:"16:00",slot_limit:4,availability_status:"Available"}
    ],
    appointments:[],consultations:[],reports:[],
    next:{user:6,patient:5,doctor:4,schedule:8,appointment:1,consultation:1,report:1}
  };
  var m=nextOn("Monday");
  db.appointments.push({appointment_id:1,patient_id:1,schedule_id:1,appointment_date:m,appointment_time:"09:00",visit_type:"Medical",reason:"Headache and dizziness",status:"Confirmed",date_requested:t});
  db.appointments.push({appointment_id:2,patient_id:2,schedule_id:1,appointment_date:m,appointment_time:"09:30",visit_type:"Medical",reason:"Follow-up check",status:"Confirmed",date_requested:t});
  db.appointments.push({appointment_id:3,patient_id:3,schedule_id:6,appointment_date:m,appointment_time:"13:30",visit_type:"Dental",reason:"Toothache",status:"Confirmed",date_requested:t});
  db.next.appointment=4;
  function cons(pid,did,daysAgo,complaint,aid,find,med,lab,fu,ref){
    db.consultations.push({consultation_id:db.next.consultation++,appointment_id:null,patient_id:pid,doctor_id:did,consultation_date:iso(addDays(today,-daysAgo)),complaint:complaint,first_aid_given:aid,findings:find,medicine_given:med,lab_request:lab,followup_required:fu,followup_date:"",referred_to_hospital:ref,remarks:""});
  }
  cons(2,1,3,"Stomach pain","Rest and water","Gastritis","Antacid, 1 tablet","",false,false);
  cons(3,0,5,"Sprained ankle","Cold compress and bandage","","","",false,false);
  cons(1,1,9,"Fever and cough","Temperature check","Viral infection","Paracetamol, 500 mg","CBC",true,false);
  cons(4,0,12,"Fainting","Rest on bed, vital signs","Referred for further check","","",false,true);
  return db;
}

var db;
try{var raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):null}catch(e){db=null}
if(!db||!db.users)db=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

/* ---------- state ---------- */
var S={user:null,view:null,msg:null,book:{type:"Medical",date:"",purpose:"",pick:{}},apptDate:iso(new Date()),apptStatus:"All",search:"",patientId:null,consult:null,repMonth:new Date().getMonth(),repYear:new Date().getFullYear(),theme:null};

function find(table,key,val){return db[table].filter(function(r){return r[key]===val})[0]}
function docName(d){return d?"Dr. "+d.first_name+" "+d.last_name:"Unassigned"}
function patName(p){return p?p.last_name+", "+p.first_name:"Unknown"}
function sched(a){return find("schedules","schedule_id",a.schedule_id)}
function apptDoctor(a){var s=sched(a);return s?find("doctors","doctor_id",s.doctor_id):null}
function left(s,date){
  var n=db.appointments.filter(function(a){return a.schedule_id===s.schedule_id&&a.appointment_date===date&&a.status!=="Cancelled"}).length;
  return s.slot_limit-n;
}
function msg(kind,text){S.msg={kind:kind,text:text}}

/* ---------- roles ---------- */
var NAV={
  Patient:[["schedules","Doctor Schedules"],["book","Book Appointment"],["mine","My Appointments"],["profile","My Information"]],
  Nurse:[["appts","Appointments"],["schedules","Doctor Schedules"],["patients","Patient Records"],["consult","Record Visit"],["reports","Monthly Report"]],
  Administrator:[["appts","Appointments"],["schedules","Doctor Schedules"],["patients","Patient Records"],["reports","Monthly Report"],["users","User Access"]],
  Doctor:[["myday","My Appointments"],["consult","Record Consultation"],["patients","Patient Records"],["myschedule","My Schedule"]]
};

/* ---------- views ---------- */
function vLogin(){
  return '<div class="login stack"><div><h1 style="font-size:1.6rem">Campus Clinic</h1><p class="muted" style="margin:4px 0 0">Appointment Scheduling and Records Management System. A working prototype with sample data.</p></div>'+
  '<form class="card stack" id="loginForm"><div><label for="u">Username</label><input id="u" autocomplete="username" required></div><div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>'+
  (S.msg?'<div class="note '+S.msg.kind+'">'+esc(S.msg.text)+'</div>':'')+
  '<button class="btn" type="submit">Log in</button></form>'+
  '<div class="card stack"><h3>Try it as</h3><div class="demo">'+
  [["student","Patient"],["nurse","Clinic nurse"],["doctor","Doctor"],["admin","Administrator"]].map(function(x){return '<button class="btn ghost" data-act="demo" data-u="'+x[0]+'">'+x[1]+'</button>'}).join("")+
  '</div><p class="muted small" style="margin:0">All sample accounts use the password demo123.</p></div></div>';
}

function vSchedules(editable){
  var docs=db.doctors;
  var rows=db.schedules.slice().sort(function(a,b){return DAYS.indexOf(a.day_of_week)-DAYS.indexOf(b.day_of_week)||a.time_start.localeCompare(b.time_start)});
  var byDay=DAYS.slice(1).concat(DAYS[0]).map(function(day){
    var items=rows.filter(function(s){return s.day_of_week===day});
    var am=items.filter(function(s){return s.availability_status==="Available"&&mins(s.time_start)<720}).length;
    return {day:day,items:items,am:am};
  });
  var gaps=byDay.filter(function(d){return d.day!=="Sunday"&&d.am===0}).map(function(d){return d.day});
  var h='<div class="stack"><div><h2>Doctor Schedules</h2><p class="muted" style="margin:4px 0 0">Check who is on duty before going to the clinic.</p></div>';
  h+='<div class="note info small">Sample schedule. The real hours are the ones posted on the wall of the Health Services Office.</div>';
  h+='<div class="card scroll"><table><thead><tr><th>Day</th><th>Doctor</th><th>Type</th><th>Hours</th><th>Slots</th><th>Status</th></tr></thead><tbody>';
  byDay.forEach(function(d){
    if(!d.items.length){h+='<tr><td>'+d.day+'</td><td colspan="5" class="muted">No doctor on duty</td></tr>';return}
    d.items.forEach(function(s,i){var doc=find("doctors","doctor_id",s.doctor_id);
      h+='<tr><td>'+(i?"":d.day)+'</td><td>'+esc(docName(doc))+'</td><td>'+esc(doc.specialization)+'</td><td>'+t12(s.time_start)+" to "+t12(s.time_end)+'</td><td>'+s.slot_limit+' per day</td><td><span class="pill '+s.availability_status+'">'+s.availability_status+'</span></td></tr>'});
  });
  h+='</tbody></table></div>';
  h+='<p class="muted small" style="margin:0">Days with no physician in the morning: '+(gaps.length?esc(gaps.join(", ")):"none")+'.</p></div>';
  return h;
}

function openOptions(){
  var b=S.book,res=[];
  if(!b.date)return res;
  var need=b.type==="Dental"?"Dentist":"Physician";
  db.schedules.forEach(function(s){
    var d=find("doctors","doctor_id",s.doctor_id);
    if(d.specialization!==need||d.status!=="Active"||s.day_of_week!==dayName(b.date)||s.availability_status!=="Available")return;
    res.push({s:s,d:d,left:left(s,b.date)});
  });
  return res;
}
function nextDays(){
  var b=S.book,need=b.type==="Dental"?"Dentist":"Physician",out=[],start=b.date?parse(b.date):new Date();
  for(var i=1;i<=21&&out.length<3;i++){var d=addDays(start,i),n=DAYS[d.getDay()];
    var ok=db.schedules.some(function(s){var doc=find("doctors","doctor_id",s.doctor_id);return s.day_of_week===n&&s.availability_status==="Available"&&doc.specialization===need&&left(s,iso(d))>0});
    if(ok)out.push(iso(d))}
  return out;
}
function vBook(){
  var b=S.book,today=iso(new Date()),h='<div class="stack"><div><h2>Book an Appointment</h2><p class="muted" style="margin:4px 0 0">Pick a visit type and a date. Only days with a doctor on duty and open slots can be booked.</p></div>';
  h+='<div class="card"><div class="grid"><div><label for="bt">Visit type</label><select id="bt" data-f="type">'+["Medical","Dental","Follow-up"].map(function(t){return '<option'+(b.type===t?" selected":"")+'>'+t+'</option>'}).join("")+'</select></div>'+
     '<div><label for="bd">Date</label><input id="bd" type="date" min="'+today+'" value="'+esc(b.date)+'" data-f="date"></div>'+
     '<div><label for="bp">Reason for visit</label><input id="bp" value="'+esc(b.purpose)+'" data-f="purpose" placeholder="For example: fever, toothache"></div></div></div>';
  if(S.msg)h+='<div class="note '+S.msg.kind+'">'+esc(S.msg.text)+'</div>';
  if(b.date){
    var opts=openOptions();
    h+='<h3>'+prettyDate(b.date)+'</h3>';
    if(!opts.length){
      var nd=nextDays();
      h+='<div class="note bad">No '+(b.type==="Dental"?"dentist":"physician")+' is on duty on '+dayName(b.date)+'.'+(nd.length?' Next available days: '+nd.map(function(x){return '<a href="#" data-act="pickdate" data-d="'+x+'">'+prettyDate(x)+'</a>'}).join(", ")+'.':'')+'</div>';
    }else{
      opts.forEach(function(o){
        var times=[];for(var m=mins(o.s.time_start);m<mins(o.s.time_end);m+=30)times.push(fromMins(m));
        var taken=db.appointments.filter(function(a){return a.schedule_id===o.s.schedule_id&&a.appointment_date===b.date&&a.status!=="Cancelled"}).map(function(a){return a.appointment_time});
        var free=times.filter(function(t){return taken.indexOf(t)<0});
        h+='<div class="card slot"><div><strong>'+esc(docName(o.d))+'</strong><div class="muted small">'+esc(o.d.specialization)+' &middot; '+t12(o.s.time_start)+' to '+t12(o.s.time_end)+'</div><div class="small" style="margin-top:4px">'+(o.left>0?'<span class="pill Available">'+o.left+' of '+o.s.slot_limit+' slots left</span>':'<span class="pill Cancelled">Fully booked</span>')+'</div></div>';
        if(o.left>0&&free.length){
          h+='<div class="row"><div><label for="t'+o.s.schedule_id+'">Time</label><select id="t'+o.s.schedule_id+'" data-pick="'+o.s.schedule_id+'">'+free.map(function(t){return '<option value="'+t+'"'+((b.pick[o.s.schedule_id]||free[0])===t?" selected":"")+'>'+t12(t)+'</option>'}).join("")+'</select></div><button class="btn" data-act="book" data-s="'+o.s.schedule_id+'">Book</button></div>';
        }
        h+='</div>';
      });
    }
  }
  return h+'</div>';
}

function apptRow(a,mode){
  var p=find("patients","patient_id",a.patient_id),d=apptDoctor(a),btn="";
  if(mode==="staff"&&a.status==="Confirmed")btn='<button class="btn small ghost" data-act="status" data-id="'+a.appointment_id+'" data-v="No-show">No-show</button> <button class="btn small danger" data-act="status" data-id="'+a.appointment_id+'" data-v="Cancelled">Cancel</button>';
  if(mode==="mine"&&a.status==="Confirmed")btn='<button class="btn small danger" data-act="status" data-id="'+a.appointment_id+'" data-v="Cancelled">Cancel</button>';
  if(mode==="doctor"&&a.status==="Confirmed")btn='<button class="btn small" data-act="record" data-id="'+a.appointment_id+'">Record visit</button>';
  return '<tr><td>'+prettyDate(a.appointment_date)+'<div class="muted small">'+t12(a.appointment_time)+'</div></td>'+(mode==="mine"?"":'<td>'+esc(patName(p))+'<div class="muted small">'+esc(p?p.student_number:"")+'</div></td>')+(mode==="doctor"?"":'<td>'+esc(docName(d))+'</td>')+'<td>'+esc(a.visit_type)+'<div class="muted small">'+esc(a.reason)+'</div></td><td><span class="pill '+a.status+'">'+a.status+'</span></td><td>'+btn+'</td></tr>';
}
function apptTable(list,mode){
  if(!list.length)return '<div class="card muted">No appointments to show.</div>';
  var head='<th>When</th>'+(mode==="mine"?"":'<th>Patient</th>')+(mode==="doctor"?"":'<th>Doctor</th>')+'<th>Visit</th><th>Status</th><th></th>';

function go(v){S.view=v;S.msg=null;S.patientId=null;S.consult=null;render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
function login(u,p){
  var user=db.users.filter(function(x){return x.username===u.trim()&&x.password===p})[0];
  if(!user){msg("bad","Wrong username or password.");render();return}
  if(user.status!=="Active"){msg("bad","This account is inactive. Ask the administrator to activate it.");render();return}
  S.user=user;S.view=null;S.msg=null;render();
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act");
  if(a==="pickdate"||a==="reset"||a==="demo")e.preventDefault();
  if(a==="demo"){login(el.getAttribute("data-u"),"demo123");return}
  if(a==="nav"){go(el.getAttribute("data-v"));return}
  if(a==="logout"){S.user=null;S.msg=null;render();return}
  if(a==="theme"){var dark=getComputedStyle(document.body).backgroundColor!=="rgb(244, 247, 247)";S.theme=dark?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme);return}
  if(a==="reset"){db=seed();save();S.user=null;S.msg=null;render();return}
  if(a==="pickdate"){S.book.date=el.getAttribute("data-d");S.msg=null;render();return}
  if(a==="book"){
    var sid=+el.getAttribute("data-s"),s=find("schedules","schedule_id",sid),b=S.book,time=S.book.pick[sid]||document.getElementById("t"+sid).value;
    if(!b.purpose.trim()){msg("warn","Please enter the reason for your visit first.");render();return}
    if(s.availability_status!=="Available"||left(s,b.date)<1){msg("bad","That slot is no longer available. Please pick another.");render();return}
    var dup=db.appointments.some(function(x){return x.schedule_id===sid&&x.appointment_date===b.date&&x.appointment_time===time&&x.status!=="Cancelled"});
    if(dup){msg("bad","That time was just taken. Please pick another time.");render();return}
    db.appointments.push({appointment_id:db.next.appointment++,patient_id:S.user.patient_id,schedule_id:sid,appointment_date:b.date,appointment_time:time,visit_type:b.type,reason:b.purpose.trim(),status:"Confirmed",date_requested:iso(new Date())});
    save();S.book={type:b.type,date:"",purpose:"",pick:{}};msg("ok","Appointment confirmed for "+prettyDate(db.appointments[db.appointments.length-1].appointment_date)+" at "+t12(time)+".");S.view="mine";render();return}
  if(a==="status"){var ap=find("appointments","appointment_id",+el.getAttribute("data-id"));ap.status=el.getAttribute("data-v");save();msg("ok","Appointment marked as "+ap.status+".");render();return}
  if(a==="alldates"){S.apptDate="";render();return}
  if(a==="open"){S.patientId=+el.getAttribute("data-id");S.msg=null;render();return}
  if(a==="back"){S.patientId=null;render();return}
  if(a==="record"){var ap2=find("appointments","appointment_id",+el.getAttribute("data-id"));S.consult={patient_id:ap2.patient_id,reason:ap2.reason,appointment_id:ap2.appointment_id};S.view="consult";S.msg=null;render();return}
  if(a==="togglesched"){var sc=find("schedules","schedule_id",+el.getAttribute("data-id"));sc.availability_status=sc.availability_status==="Available"?"Unavailable":"Available";save();msg("ok","Schedule updated. Patients see the change right away.");render();return}
  if(a==="toggleuser"){var us=find("users","user_id",+el.getAttribute("data-id"));us.status=us.status==="Active"?"Inactive":"Active";save();msg("ok",us.full_name+" is now "+us.status+".");render();return}
  if(a==="genreport"){
    var m=S.repMonth,y=S.repYear,list=db.consultations.filter(function(c){var d=parse(c.consultation_date);return d.getMonth()===m&&d.getFullYear()===y});
    var rep={report_id:db.next.report++,report_month:m,report_year:y,total_visits:list.length,total_consultations:list.filter(function(c){return c.findings}).length,total_first_aid:list.filter(function(c){return c.first_aid_given}).length,total_referrals:list.filter(function(c){return c.referred_to_hospital}).length,generated_by:S.user.user_id,date_generated:iso(new Date())};
    db.reports.push(rep);save();msg("ok","Report for "+MONTHS[m]+" "+y+" saved.");render();return}
});
document.addEventListener("change",function(e){
  var t=e.target,f=t.getAttribute("data-f");
  if(t.hasAttribute("data-pick")){S.book.pick[t.getAttribute("data-pick")]=t.value;return}
  if(!f)return;
  var v=t.value;
  if(f==="type"||f==="date"||f==="purpose"){S.book[f]=v;if(f!=="purpose"){S.msg=null;render()}return}
  if(f==="repMonth"){S.repMonth=+v}else if(f==="repYear"){S.repYear=+v||S.repYear}else S[f]=v;

});

function val(id){return document.getElementById(id).value}
function readPatient(id){var o={};["student_number","patient_type","last_name","first_name","middle_name","department","year_level","contact_number","email","guardian_name","guardian_contact"].forEach(function(k){o[k]=val(id+k).trim()});return o}
document.addEventListener("submit",function(e){
  e.preventDefault();var id=e.target.id;
  if(id==="loginForm"){login(val("u"),val("p"));return}
  if(id==="newPatient"){
    var o=readPatient("newPatient");
    if(db.patients.some(function(p){return p.student_number===o.student_number})){msg("bad","A patient with that number is already registered.");render();return}
    o.patient_id=db.next.patient++;o.date_registered=iso(new Date());db.patients.push(o);save();msg("ok",patName(o)+" was registered.");render();return}
  if(id==="myInfo"){var p=find("patients","patient_id",S.user.patient_id),o2=readPatient("myInfo");Object.keys(o2).forEach(function(k){p[k]=o2[k]});save();msg("ok","Your information was saved.");render();return}
  if(id==="schedForm"){
    var s1=val("s1"),s2=val("s2");if(mins(s2)<=mins(s1)){msg("bad","The end time must be after the start time.");render();return}
    db.schedules.push({schedule_id:db.next.schedule++,doctor_id:S.user.doctor_id,day_of_week:val("sd"),time_start:s1,time_end:s2,slot_limit:+val("sl"),availability_status:"Available"});save();msg("ok","Schedule added.");render();return}
  if(id==="userForm"){
    var un=val("nu").trim();if(db.users.some(function(u){return u.username===un})){msg("bad","That username is taken.");render();return}
    db.users.push({user_id:db.next.user++,username:un,password:val("np"),full_name:val("nf").trim(),role:val("nr"),status:"Active",date_created:iso(new Date())});save();msg("ok","Account created.");render();return}
  if(id==="consultForm"){
    var did=S.user.role==="Doctor"?S.user.doctor_id:+val("cd"),fu=val("cfd");
    var rec={consultation_id:db.next.consultation++,appointment_id:S.consult&&S.consult.appointment_id||null,patient_id:+val("cp"),doctor_id:did,consultation_date:val("cdt"),complaint:val("cc").trim(),first_aid_given:val("cf").trim(),findings:val("cn").trim(),medicine_given:val("cm").trim(),lab_request:val("cl").trim(),followup_required:!!fu,followup_date:fu,referred_to_hospital:document.getElementById("chosp").checked,remarks:val("cr").trim()};
    db.consultations.push(rec);
    if(rec.appointment_id){find("appointments","appointment_id",rec.appointment_id).status="Completed"}
    save();S.consult=null;msg("ok","Visit recorded for "+patName(find("patients","patient_id",rec.patient_id))+".");render();return}
